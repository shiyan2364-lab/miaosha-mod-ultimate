name: build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon --stacktrace --no-configuration-cache
      - run: ls -la build/libs/
      - uses: actions/upload-artifact@v4
        with:
          name: miaosha-mod-ultimate-1.16.5
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
